name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Web Dependencies
        run: npm ci --ignore-scripts

      - name: Build Web Assets
        run: npm run build --if-present

      - name: Ensure Web Directory Exists & Sync Capacitor
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            echo '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" /></head><body><div id="root"></div></body></html>' > dist/index.html
          fi
          npx cap add android || true
          npx cap sync android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Streambert-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
