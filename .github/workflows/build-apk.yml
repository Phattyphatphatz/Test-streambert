name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20  # Upgraded from 18 to fix EBADENGINE errors

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Web Dependencies
        run: npm ci --ignore-scripts  # Bypasses the failing electron install script

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor to Android
        run: |
          npx cap sync android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Streambert-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
